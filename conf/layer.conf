# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-neil"
BBFILE_PATTERN_meta-neil = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-neil = "10"

LAYERDEPENDS_meta-neil = "core"
LAYERSERIES_COMPAT_meta-neil = "scarthgap"
